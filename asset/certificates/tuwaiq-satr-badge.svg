<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <linearGradient id="tuwaiqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E3D"/>
      <stop offset="50%" stop-color="#0E2D59"/>
      <stop offset="100%" stop-color="#051020"/>
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="550" rx="16" fill="url(#tuwaiqBg)" stroke="#1E3A8A" stroke-width="2"/>
  
  <!-- Outer decorative border -->
  <rect x="25" y="25" width="750" height="500" rx="12" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <rect x="35" y="35" width="730" height="480" rx="8" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.3"/>

  <!-- Seal / Logo -->
  <circle cx="400" cy="140" r="55" fill="#0A192F" stroke="url(#purpleGold)" stroke-width="3" filter="url(#badgeGlow)"/>
  <text x="400" y="135" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="2">سطر</text>
  <text x="400" y="160" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SATR PROGRAM</text>

  <!-- Title -->
  <text x="400" y="235" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="700">CERTIFICATE OF COMPLETION</text>
  <text x="400" y="265" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="14" letter-spacing="1">TUWAIQ ACADEMY • SAUDI ARABIA</text>

  <!-- Recipient -->
  <text x="400" y="315" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">This is proudly presented to</text>
  <text x="400" y="355" text-anchor="middle" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="26" font-weight="800">Mostafa Magdy Abdelhamid</text>

  <!-- Body -->
  <text x="400" y="395" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="13">For successfully completing the technical software track in the SATR Educational Platform</text>
  
  <!-- Footer credentials -->
  <line x1="120" y1="440" x2="680" y2="440" stroke="#1E3A8A" stroke-width="1"/>
  
  <text x="220" y="475" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12">ACADEMY: TUWAIQ</text>
  <text x="400" y="475" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="12">STATUS: VERIFIED</text>
  <text x="580" y="475" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="12">YEAR: 2026</text>
</svg>